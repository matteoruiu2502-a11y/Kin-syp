name: Republier le site

# Le site (Escal'hop! à la racine, KinéSyP dans app/) est publié par GitHub
# Pages depuis la branche principale. Les modifications faites par une
# application (fusion automatique, bot) ne relancent pas cette publication :
# ce workflow la redemande à chaque modification de la branche principale.
on:
  push:
  workflow_dispatch:

permissions:
  pages: write

jobs:
  rebuild:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Demander une nouvelle publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sSf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
