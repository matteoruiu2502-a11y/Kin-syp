name: Vérifications

# Tests automatiques à chaque modification : cœur de mesure, serveur, version web.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mobile:
    name: App tablette (tests + types)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx jest --ci

  server:
    name: Serveur (tests d'intégration)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  web:
    name: Version web (build)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run build

  biltov:
    name: Landing Biltov (types + build)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: biltov } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: biltov/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
