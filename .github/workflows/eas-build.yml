name: Construire l'app tablette

# Construit l'application avec Expo EAS (dans le cloud d'Expo).
# Prérequis (une fois) : Settings → Secrets and variables → Actions →
#   New repository secret : EXPO_TOKEN (expo.dev → Account settings → Access tokens).
# Utilisation : onglet Actions → « Construire l'app tablette » → Run workflow.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Plateforme
        type: choice
        options: [android, ios, all]
        default: android
      profile:
        description: "preview = APK à installer par lien ; production = pour les stores"
        type: choice
        options: [preview, production, development]
        default: preview
      submit:
        description: Envoyer aussi aux stores (profil production uniquement)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - name: Vérifier le jeton Expo
        working-directory: .
        env: { EXPO_TOKEN: '${{ secrets.EXPO_TOKEN }}' }
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Ajoutez le secret EXPO_TOKEN (expo.dev → Account settings → Access tokens) dans Settings → Secrets and variables → Actions."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: npx jest --ci
      - name: Adresse du serveur de comptes
        if: ${{ vars.KINESYP_API_URL != '' }}
        env: { API_URL: '${{ vars.KINESYP_API_URL }}' }
        run: node -e "const f='app.json';const c=require('./'+f);c.expo.extra={...c.expo.extra,apiUrl:process.env.API_URL};require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
      - name: Lier le projet Expo (première fois)
        run: eas init --non-interactive --force
      - name: Build
        run: >-
          eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }}
          --non-interactive --json
          ${{ (inputs.submit && inputs.profile == 'production') && '--auto-submit' || '' }}
          > build.json
      - name: Liens d'installation
        if: always()
        run: node scripts/eas-summary.js build.json
